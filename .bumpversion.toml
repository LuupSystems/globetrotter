[tool.bumpversion]
current_version = "0.0.15"
commit = true
tag = true
pre_commit_hooks = [
  # Refresh workspace package versions without updating dependencies.
  "cargo metadata --offline --format-version 1 >/dev/null",
  # Rebuild the generator so quickstart headers contain the bumped version.
  "cargo run --offline --locked -p globetrotter-cli -- -c docs/examples/quickstart/globetrotter.yaml"
]
additional_files = [
  "Cargo.lock",
  "docs/examples/*/generated/**"
]

[[tool.bumpversion.files]]
filename = "Cargo.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "docs/content/docs/ci.md"
search = "--version {current_version}"
replace = "--version {new_version}"
