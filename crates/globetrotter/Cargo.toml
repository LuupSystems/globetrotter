[package]
name = "globetrotter"
license = "MIT"
readme = "../../README.md"
documentation = "https://docs.rs/globetrotter"
publish = true

version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
categories = [
  "command-line-utilities",
  "internationalization",
  "localization",
]
keywords = [
  "i8n",
  "internationalization",
  "translations",
]

[lints]
workspace = true

[features]
default = [
  "typescript",
  "rust",
  "golang",
  "python",
  "rayon",
  "semantic",
]
typescript = ["dep:globetrotter-typescript"]
rust = ["dep:globetrotter-rust"]
golang = ["dep:globetrotter-golang"]
python = ["dep:globetrotter-python"]
# Opt-in semantic drift detection during linting. Pulls in a CPU-only embedding
# stack (candle); disable with `--no-default-features` for a lighter build.
semantic = ["dep:globetrotter-semantic", "dep:indicatif"]

[package.metadata.cargo-fc]
# Language backends are independent alternatives in the matrix. The `default` row
# still exercises the supported configuration with every backend enabled together.
mutually_exclusive_features = [[
  "typescript",
  "rust",
  "golang",
  "python",
]]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
strum.workspace = true
thiserror.workspace = true
itertools.workspace = true
tracing.workspace = true
tokio.workspace = true
futures.workspace = true

# colors and diagnostics
codespan-reporting.workspace = true
colored = "3"
strip-ansi-escapes = "0"
unindent = "0"

# multi-pattern search and gitignore-aware walking for dead-key detection
aho-corasick = "1"
ignore = "0.4"

# show compressed file sizes of json translation files
flate2 = { version = "1", features = ["rust_backend"], default-features = false }
human_bytes = "0"

# path globbing and templating
glob = "0"
pathdiff = "0"
normalize-path = "0"
handlebars = "6"

# config parsing
serde.workspace = true
indexmap = { workspace = true, features = ["serde", "rayon"] }
yaml-spanned = "0"
toml-span = { version = "0", features = ["reporting", "serde"] }

# model
globetrotter-model.workspace = true

# optional: language targets
globetrotter-typescript = { workspace = true, optional = true }
globetrotter-rust = { workspace = true, optional = true }
globetrotter-golang = { workspace = true, optional = true }
globetrotter-python = { workspace = true, optional = true }

# optional: semantic drift detection
globetrotter-semantic = { workspace = true, optional = true }

# optional: progress bars for the semantic phase
indicatif = { version = "0.17", optional = true }

# optional: rayon for parallel processing
rayon = { version = "1", optional = true }

[dev-dependencies]
color-eyre.workspace = true
similar-asserts.workspace = true
