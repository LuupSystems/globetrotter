[package]
name = "globetrotter"
license = "MIT"
readme = "../../README.md"
documentation = "https://docs.rs/globetrotter"
publish = true

version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
categories = [
  "command-line-utilities",
  "internationalization",
  "localization",
]
keywords = [
  "i8n",
  "internationalization",
  "translations",
]

[lints]
workspace = true

[features]
# `rayon` and `llm-judge` are deliberately not default: library consumers
# should not pull in a thread pool or an HTTP client stack unasked. The CLI
# enables both through its own default features.
default = [
  "typescript",
  "rust",
  "golang",
  "python",
]
typescript = ["dep:globetrotter-typescript"]
rust = ["dep:globetrotter-rust"]
golang = ["dep:globetrotter-golang"]
python = ["dep:globetrotter-python"]
# LLM-judged translation-consistency review during linting. Pulls in an HTTP
# client stack (async-openai/reqwest); disable for a lighter build.
llm-judge = ["dep:globetrotter-llm-judge", "dep:indicatif"]
# Parallel catalog validation and sorting in the model crate.
rayon = ["globetrotter-model/rayon"]

# Source parsing is independent of the configured output languages.
tree-sitter = [
  "dep:html-escape",
  "dep:tree-sitter-angular",
  "dep:tree-sitter",
  "dep:tree-sitter-typescript",
  "dep:tree-sitter-javascript",
  "dep:tree-sitter-rust",
  "dep:tree-sitter-go",
  "dep:tree-sitter-python",
  "dep:tree-sitter-ruby",
  "dep:tree-sitter-php",
  "dep:tree-sitter-java",
  "dep:tree-sitter-kotlin-ng",
  "dep:tree-sitter-swift",
  "dep:tree-sitter-dart",
  "dep:tree-sitter-elixir",
  "dep:tree-sitter-lua",
  "dep:tree-sitter-zig",
  "dep:tree-sitter-c-sharp",
  "dep:tree-sitter-html",
  "dep:tree-sitter-css",
  "dep:tree-sitter-vue-next",
  "dep:tree-sitter-svelte-next",
  "dep:tree-sitter-astro-next",
]

[package.metadata.cargo-fc]
# Language backends are independent alternatives in the matrix. The `default` row
# still exercises the supported configuration with every backend enabled together.
mutually_exclusive_features = [[
  "typescript",
  "rust",
  "golang",
  "python",
]]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
strum.workspace = true
thiserror.workspace = true
itertools.workspace = true
tracing.workspace = true
tokio.workspace = true
futures.workspace = true

# colors and diagnostics
codespan-reporting.workspace = true
colored = "3"
strip-ansi-escapes = "0"
indoc.workspace = true

# Ignore files let repositories control which sources belong in usage scans.
ignore = "0.4"

# Optional parsers let library consumers omit syntax-aware source scanning.
tree-sitter = { version = "0.25", optional = true }
tree-sitter-angular = { version = "0.9", optional = true }
html-escape = { version = "0.2", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-ruby = { version = "0.23", optional = true }
tree-sitter-php = { version = "0.24", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-kotlin-ng = { version = "1", optional = true }
tree-sitter-swift = { version = "0.7", optional = true }
tree-sitter-dart = { version = "0.2", optional = true }
tree-sitter-elixir = { version = "0.3", optional = true }
tree-sitter-lua = { version = "0.5", optional = true }
tree-sitter-zig = { version = "1", optional = true }
tree-sitter-c-sharp = { version = "0.23", optional = true }
tree-sitter-html = { version = "0.23", optional = true }
tree-sitter-css = { version = "0.25", optional = true }
tree-sitter-vue-next = { version = "0.1", optional = true }
tree-sitter-svelte-next = { version = "0.1", optional = true }
tree-sitter-astro-next = { version = "0.1", optional = true }

# show compressed file sizes of json translation files
flate2 = { version = "1", features = ["rust_backend"], default-features = false }
human_bytes = "0"

# path globbing and templating
glob = "0"
pathdiff = "0"
normalize-path = "0"
handlebars.workspace = true

# config parsing and JSON output
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
yaml-spanned = "0"
toml-span = { version = "0", features = ["reporting", "serde"] }

# The model crate has its default features off so that `rayon` is opted into
# through this crate's own feature rather than always pulled in.
globetrotter-model = { path = "../globetrotter-model", default-features = false }

# optional: language targets
globetrotter-typescript = { workspace = true, optional = true }
globetrotter-rust = { workspace = true, optional = true }
globetrotter-golang = { workspace = true, optional = true }
globetrotter-python = { workspace = true, optional = true }

# optional: LLM-judged translation-consistency review
globetrotter-llm-judge = { workspace = true, optional = true }

# optional: progress bars for the judging phase
indicatif = { version = "0.18.6", optional = true }

[dev-dependencies]
color-eyre.workspace = true
similar-asserts.workspace = true
test-util.workspace = true
