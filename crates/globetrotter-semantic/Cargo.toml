[package]
name = "globetrotter-semantic"
license = "MIT"
readme = "../../README.md"
documentation = "https://docs.rs/globetrotter-semantic"
publish = true

version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
categories = [
  "command-line-utilities",
  "internationalization",
  "localization",
]
keywords = [
  "i8n",
  "internationalization",
  "translations",
  "embeddings",
]

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true

# CPU-only cross-lingual sentence embeddings. No CUDA/Metal features are
# enabled, so the build stays portable and dependency-light.
candle-core = { version = "0.10", default-features = false }
candle-nn = { version = "0.10", default-features = false }
candle-transformers = { version = "0.10", default-features = false }

# tokenizer.json loading. `fancy-regex` is the pure-Rust regex backend (the
# default `onig` pulls a C library); the http/progressbar extras are unused.
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }

# on-demand model download + local caching via the blocking ureq client.
# ureq brings its own rustls TLS, so we avoid hf-hub's native-tls path (which
# would pull in the full reqwest/hyper async stack and a system OpenSSL).
hf-hub = { version = "0.4", default-features = false, features = ["ureq"] }

# downloading the cross-lingual word vectors and bilingual dictionaries (the
# hybrid data files); ureq ships its own rustls TLS, no system OpenSSL.
ureq = "2"

[dev-dependencies]
color-eyre.workspace = true
