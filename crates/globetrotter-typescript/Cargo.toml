[package]
name = "globetrotter-typescript"
license = "MIT"
readme = "../../README.md"
documentation = "https://docs.rs/globetrotter-typescript"
publish = true

version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
categories = [
  "command-line-utilities",
  "internationalization",
  "localization",
]
keywords = [
  "i8n",
  "internationalization",
  "translations",
  "typescript",
]

[lints]
workspace = true

[features]
default = ["swc"]
swc = ["dep:swc_core", "dep:anyhow", "dep:globetrotter-model", "dep:thiserror"]
serde = ["dep:serde"]

[package.metadata.cargo-fc]
# `default` enables `swc`, so varying both names would duplicate every SWC state.
# Keep the shipped `default` axis and cross it with `serde`.
exclude_features = ["swc"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
thiserror = { workspace = true, optional = true }

globetrotter-model = { workspace = true, optional = true }

indoc.workspace = true

# optional: swc based typescript codegen
swc_core = { version = "84.0.1", features = ["base", "common", "ecma_ast"], optional = true }
anyhow = { version = "1", optional = true }

# serialization
serde = { workspace = true, optional = true }

[dev-dependencies]
color-eyre.workspace = true
similar-asserts.workspace = true
test-util.workspace = true
# include ecma parser for reference
swc_core = { version = "84.0.1", features = ["base", "common", "ecma_ast", "ecma_parser"] }
