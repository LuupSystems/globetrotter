[package]
name = "globetrotter-model"
license = "MIT"
readme = "../../README.md"
documentation = "https://docs.rs/globetrotter-model"
publish = true

version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
categories = [
  "command-line-utilities",
  "internationalization",
  "localization",
]
keywords = [
  "i8n",
  "internationalization",
  "translations",
]

[lints]
workspace = true

[features]
default = ["rayon"]
rayon = ["dep:rayon", "indexmap/rayon"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
strum.workspace = true
thiserror.workspace = true

# Tracing
tracing.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true

# TOML
toml-span = { version = "0", features = ["reporting", "serde"] }

# Parser diagnostics
codespan-reporting.workspace = true
indoc.workspace = true

# Template engines to validate templates
handlebars.workspace = true

# Optional: rayon for parallel validation of translations
rayon = { version = "1", optional = true }

[dev-dependencies]
color-eyre.workspace = true
similar-asserts.workspace = true
test-util.workspace = true
