[package]
name = "globetrotter-cli"
license = "MIT"
readme = "../../README.md"
documentation = "https://docs.rs/globetrotter-cli"
publish = true

version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
categories = [
  "command-line-utilities",
  "internationalization",
  "localization",
]
keywords = [
  "i8n",
  "internationalization",
  "translations",
]

[lints]
workspace = true

[features]
default = [
  "typescript",
  "rust",
  "golang",
  "python",
  "rayon",
  "semantic",
]
typescript = ["globetrotter/typescript"]
rust = ["globetrotter/rust"]
golang = ["globetrotter/golang"]
python = ["globetrotter/python"]
rayon = ["globetrotter/rayon"]
# Disabling `semantic` drops the whole embedding stack (candle) from the build;
# the `--semantic*` flags disappear with it.
semantic = ["globetrotter/semantic"]

[package.metadata.cargo-fc]
# Language selectors are independent alternatives in the matrix. The `default` row
# still exercises the shipped CLI with every backend enabled together.
mutually_exclusive_features = [[
  "typescript",
  "rust",
  "golang",
  "python",
]]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bin]]
name = "globetrotter"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
futures.workspace = true
color-eyre.workspace = true
strum.workspace = true
thiserror.workspace = true

# colors and diagnostics
termcolor = "1"
codespan-reporting.workspace = true

# argument parsing
clap.workspace = true

# logging
tracing.workspace = true
tracing-subscriber = { version = "0", features = ["json", "env-filter"] }

# default-features off so the CLI's own features fully control globetrotter's
# (notably `semantic`, so disabling it drops the candle dependency).
globetrotter = { path = "../globetrotter", default-features = false }
handlebars.workspace = true

# OS-standard user cache directory for models and downloaded data
dirs = "6"

# format: sort translation files while preserving comments
toml_edit = "0"

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0"

[dev-dependencies]
color-eyre.workspace = true
similar-asserts.workspace = true
indoc.workspace = true
