baseURL = 'https://luupsystems.github.io/globetrotter/'
title = 'globetrotter'
locale = 'en-us'

disablePathToLower = true
enableGitInfo = false
enableRobotsTXT = true

[module]
[[module.imports]]
path = 'github.com/alex-shpak/hugo-book'

[[module.mounts]]
source = 'assets'
target = 'assets'
[[module.mounts]]
source = 'examples'
target = 'assets/examples'

[markup]
[markup.goldmark.renderer]
  unsafe = true
[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
  ordered = false
[markup.highlight]
  noClasses = false
  tabWidth = 2

[params]
  description = 'Generate runtime translations and type-safe bindings for every language in a polyglot application from one set of TOML translation files.'

  BookTheme = 'auto'
  BookSection = 'docs'
  BookToC = true
  BookSearch = true
  BookComments = false
  BookServiceWorker = false

  BookRepo = 'https://github.com/LuupSystems/globetrotter'
  BookEditLink = '{{ .Site.Params.BookRepo }}/edit/main/docs{{ .Path }}'

[menu]
[[menu.after]]
  name = 'GitHub'
  url = 'https://github.com/LuupSystems/globetrotter'
  weight = 10
[[menu.after]]
  name = 'crates.io'
  url = 'https://crates.io/crates/globetrotter-cli'
  weight = 20
[[menu.after]]
  name = 'docs.rs'
  url = 'https://docs.rs/globetrotter'
  weight = 30
