[workspace]
resolver = "2"
members = [
  "examples/example-rust",
  "crates/*",
]
default-members = [
  "crates/globetrotter-cli",
]

[workspace.package]
version = "0.0.10"
edition = "2024"
authors = ["roman <roman@luup-systems.com>"]
description = "Polyglot, type-safe internationalization"
license-file = "LICENSE"
readme = "README.md"
homepage = "https://github.com/LuupSystems/globetrotter"
repository = "https://github.com/LuupSystems/globetrotter"

[workspace.metadata.cargo-fc]
install_missing_targets = true
dedupe = true
# We aggregate targets to reduce combinations of features that must be compiled
aggregate_targets = true 
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-gnu",
  "aarch64-apple-darwin",
]

[workspace.metadata.cargo-fc.subcommands.udeps]
maximal_features = true

[workspace.lints.rust]
warnings = { level = "warn", priority = -1 }
unsafe_code = "deny"
unused_must_use = "deny"
# Warn-only: keep iteration fast during development; CI/review still adds the docs.
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
indexing_slicing = "deny"
missing_errors_doc = "warn"
await_holding_lock = "deny"
# Every `#[allow(...)]` must carry a `reason = "..."` justifying the escape hatch.
allow_attributes_without_reason = "deny"

# Allowed
map_unwrap_or = "allow"
assigning_clones = "allow"
struct_excessive_bools = "allow"

[profile.dev]
debug = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[workspace.dependencies]
thiserror = "2"
tracing = "0"
itertools = "0"
strum = { version = "0", features = ["derive"] }
indoc = "2"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }

# async runtime
tokio = { version = "1", features = ["full"] }
futures = "0"

# testing
color-eyre = "0"
similar-asserts = "2.0.0"
test-util = { path = "./crates/test-util" }

# CLI
clap = { version = "4", features = ["derive", "env"]}

# Diagnostics
codespan-reporting = "0.13"

# templating
handlebars = "6"

# workspace crates
globetrotter = { path = "./crates/globetrotter/" }
globetrotter-model = { path = "./crates/globetrotter-model/" }
globetrotter-llm-judge = { path = "./crates/globetrotter-llm-judge/" }
globetrotter-cli = { path = "./crates/globetrotter-cli/" }
globetrotter-rust = { path = "./crates/globetrotter-rust/" }
globetrotter-php = { path = "./crates/globetrotter-php/" }
globetrotter-python = { path = "./crates/globetrotter-python/" }
globetrotter-typescript = { path = "./crates/globetrotter-typescript/" }
globetrotter-golang = { path = "./crates/globetrotter-golang/" }
