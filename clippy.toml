# Tests propagate fallible setup through `eyre::Result`; panic and indexing
# remain available for assertions where their failure output is useful.
allow-unwrap-in-tests = false
allow-expect-in-tests = false
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

# Proper nouns that look like code identifiers but should not be backticked in docs.
# `..` appends to clippy's built-in list (GitHub, PyTorch, …) rather than replacing it.
doc-valid-idents = [".."]

disallowed-macros = [
  { path = "std::dbg", reason = "remove before commit" },
]
