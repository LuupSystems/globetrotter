version: 1
configs:
  my-other-translations:
    languages: &languages ["en", "de", fr]
    engine: handlebars
    inputs:
      - prefix: "other-a"
        prepend_relative_path: true
        path: ./translations/a.toml
    outputs:
      json:
        - ./output/other_translations_{{language}}.json

  my-translations:
    languages: *languages
    engine: handlebars
    strict: true
    check_templates: true
    inputs:
      - prefix: "my-a"
        prepend_filename: true

        path: ./translations/a.toml

      - path: ./translations/b.toml
        prefix: "my-b"
        prepend_filename: true
    outputs:
      json:
        - ./output/translations_{{language}}.json
      typescript:
        type: ./output/typescript_types.ts
      rust:
        - ./output/rust_types.rs
      golang:
        - ./output/golang_types.go
      python:
        - ./output/python_types.py
