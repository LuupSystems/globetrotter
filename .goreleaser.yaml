# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
dist: goreleaser-dist

builds:
  - id: &bin globetrotter
    builder: rust
    binary: *bin
    tool: cargo
    command: zigbuild
    # see: https://doc.rust-lang.org/nightly/rustc/platform-support.html
    targets:
      # linux
      - x86_64-unknown-linux-musl
      - aarch64-unknown-linux-musl
      # apple
      - x86_64-apple-darwin
      - aarch64-apple-darwin
      # windows
      - x86_64-pc-windows-gnu
      - aarch64-pc-windows-gnullvm
    flags: ["--release", "--package=globetrotter-cli"]

archives:
  - id: *bin
    ids: [*bin]
    formats: ["tar.gz"]
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE]
    format_overrides:
      - goos: windows
        formats: ["zip"]

checksum:
  name_template: "checksums.txt"

changelog:
  use: github
  filters:
    exclude: ["^ci:", "^docs:", "^test:"]

homebrew_casks:
  - name: *bin
    ids: [*bin]
    description: "Polyglot, type-safe internationalization"
    custom_block: |
      os macos: "darwin", linux: "linux"
    directory: Casks
    commit_author:
      name: roman
      email: roman@luup-systems.com
    repository:
      owner: LuupSystems
      name: homebrew-tap
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
      pull_request:
        enabled: false
    hooks:
      post:
        install: |
          if OS.mac? && File.exist?("/usr/bin/xattr")
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/globetrotter"]
          end

release:
  draft: false
